name: Build Senerita Eats APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project
        run: |
          echo "Files in repository:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        id: gradle
        run: |
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "gradlew=$GRADLEW" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          GRADLEW="${{ steps.gradle.outputs.gradlew }}"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Senerita-Eats-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
