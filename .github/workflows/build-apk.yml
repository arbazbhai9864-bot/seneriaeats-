name: Build Senerita Eats APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -la

          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found inside project folder"
            echo "Project files:"
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          chmod +x "$GRADLEW"

          echo "Gradle wrapper found:"
          echo "$GRADLEW"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        shell: bash
        run: |
          set -e

          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          cd "$(dirname "$GRADLEW")"

          echo "Building APK..."
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        shell: bash
        run: |
          echo "APK files generated:"
          find project -type f -path '*/build/outputs/apk/debug/*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Senerita-Eats-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
